services:
  api:
    image: ${DOCKER_IMAGE:?Define DOCKER_IMAGE=usuario/agua-fix-api}:latest
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node node_modules/typeorm/cli.js migration:run -d dist/db/datasource.js && exec node dist/main"]

  postgres:
    image: postgres:16
    container_name: agua-fix-api-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
